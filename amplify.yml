version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Default Amplify image uses Node 16; deps require >=18.20.3
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
